<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed | FPVGate Shop</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="logo-black.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
    <script>
    /* Set the theme before first paint to avoid a flash of the wrong palette. */
    (function(){try{var t=localStorage.getItem('fpvgate-theme');
    if(!t)t=window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
    document.documentElement.setAttribute('data-theme',t);}catch(e){
    document.documentElement.setAttribute('data-theme','dark');}
    document.documentElement.classList.add('js');})();
    </script>
    <link rel="stylesheet" href="styles.css?v=20260925b">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a class="nav-brand" href="index.html">
                <img src="images/LogoAnimated.svg" alt="" class="nav-logo">
                <h1>FPVGate</h1>
            </a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="shop.html">Shop</a>
                <a href="docs.html">Documentation</a>
                <a href="https://github.com/LouisHitchcock/FPVGate" target="_blank" rel="noopener">GitHub</a>
                <a href="flasher.html" class="btn-primary">Flash Firmware</a>
            </div>
            <div class="nav-actions">
                <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch theme">
                    <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
                </button>
                <button class="nav-toggle" type="button" data-nav-toggle aria-label="Toggle menu" aria-expanded="false">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </nav>

    <section class="store-hero">
        <div class="container">
            <h1 id="success-title">Processing Order...</h1>
            <p class="subtitle" id="success-subtitle">Please wait while we confirm your payment.</p>
        </div>
    </section>

    <section class="store-content">
        <div class="container">
            <div id="order-details" style="max-width:600px;margin:0 auto;text-align:center;padding:2rem 0;">
                <div class="loading-products" style="padding:40px;color:var(--text-secondary);">
                    Loading order details...
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <div class="footer-meta">
                <p>Built for the FPV community.</p>
                <p>Licensed under CC BY-NC-SA 4.0</p>
            </div>
            <div class="footer-links">
                <a href="https://github.com/LouisHitchcock/FPVGate" target="_blank">GitHub</a>
                <a href="https://discord.gg/XwammuWCCj" target="_blank">Discord</a>
                <a href="docs.html">Documentation</a>
            </div>
        </div>
    </footer>

    <script>
    (async function() {
        // Clear cart immediately
        localStorage.removeItem('fpvgate_cart');

        const params = new URLSearchParams(window.location.search);
        const sessionId = params.get('session_id');
        const titleEl = document.getElementById('success-title');
        const subEl = document.getElementById('success-subtitle');
        const detailsEl = document.getElementById('order-details');

        if (!sessionId) {
            titleEl.textContent = 'No Order Found';
            subEl.textContent = 'It looks like you arrived here without placing an order.';
            detailsEl.innerHTML = '<a href="shop.html" class="btn btn-primary" style="margin-top:20px">Back to Shop</a>';
            return;
        }

        // Try to load order details (webhook may not have fired yet, so retry)
        let order = null;
        for (let i = 0; i < 6; i++) {
            try {
                const resp = await fetch(`https://fpvgate-store.fpvgate-analytics.workers.dev/order-status?session_id=${sessionId}`);
                const data = await resp.json();
                if (!data.error) { order = data; break; }
            } catch (e) {}
            await new Promise(r => setTimeout(r, 2000));
        }

        titleEl.textContent = 'Order Confirmed!';
        subEl.textContent = 'Thank you for your purchase. You will receive a confirmation email shortly.';

        if (order) {
            const items = Array.isArray(order.items) ? order.items : [];
            const preorderDate = items.map(i => i.preorderShipDate).filter(Boolean).sort().pop();
            const preorderLabel = preorderDate
                ? new Date(preorderDate + 'T00:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' })
                : '';
            detailsEl.innerHTML = `
                ${preorderDate ? `<div class="preorder-notice" style="text-align:left;margin-bottom:24px">
                    <strong>This is a pre-order</strong>
                    <p>Your order will not be shipped until <strong>${preorderLabel}</strong>. We'll email you when it is on its way.</p>
                </div>` : ''}
                <div style="background:var(--card-bg);border-radius:10px;border:1px solid rgba(0,212,255,0.1);padding:24px;text-align:left;margin-bottom:24px">
                    <div style="display:flex;justify-content:space-between;margin-bottom:16px">
                        <span style="color:var(--text-secondary)">Order</span>
                        <strong style="color:var(--primary-color)">#${order.invoiceNumber || 'Pending'}</strong>
                    </div>
                    ${items.map(i => `
                        <div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid rgba(255,255,255,0.06)">
                            <span>${i.name} x${i.quantity}</span>
                            <span>&pound;${(i.totalPrice || i.price * i.quantity).toFixed(2)}</span>
                        </div>
                    `).join('')}
                    <div style="display:flex;justify-content:space-between;padding:12px 0 0;border-top:1px solid rgba(0,212,255,0.1);margin-top:8px;font-weight:700;font-size:18px">
                        <span>Total</span>
                        <span style="color:var(--primary-color)">&pound;${order.total.toFixed(2)}</span>
                    </div>
                </div>
                <a href="shop.html" class="btn btn-primary">Continue Shopping</a>
            `;
        } else {
            detailsEl.innerHTML = `
                <p style="color:var(--text-secondary);margin-bottom:20px">Your payment was received. Order details will be sent to your email.</p>
                <a href="shop.html" class="btn btn-primary">Continue Shopping</a>
            `;
        }

        // Track order completed
        if (window.fpvgateAnalytics && order) {
            window.fpvgateAnalytics.track('order_completed', { invoice: order.invoiceNumber, total: order.total });
        }
    })();
    </script>
    <script src="analytics-tracker.js"></script>
    <script src="theme.js"></script>
</body>
</html>
