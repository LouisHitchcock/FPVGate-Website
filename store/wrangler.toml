name = "fpvgate-store"
main = "worker.js"
compatibility_date = "2024-01-01"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "fpvgate-store-db"
database_id = "5e54869f-c57a-4bbc-a0be-e2e86853e801"

# R2 bucket for product images
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "fpvgate-product-images"

[vars]
FROM_EMAIL = "FPVGate <orders@fpvgate.xyz>"
# Optional override for Shippo label output format
SHIPPO_LABEL_FILE_TYPE = "PDF_4x6"

# Secrets (set via `wrangler secret put`):
# SHIPPO_API_TOKEN - Shippo API token
# STRIPE_SECRET_KEY - Stripe secret key (sk_live_... or sk_test_...)
# STRIPE_WEBHOOK_SECRET - Stripe webhook signing secret (whsec_...)
# ADMIN_TOKEN - Token for admin portal authentication
# RESEND_API_KEY - Resend API key for transactional emails (re_...)
