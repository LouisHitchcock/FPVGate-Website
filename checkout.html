<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | FPVGate Shop</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="logo-black.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
    <script>
    /* Set the theme before first paint to avoid a flash of the wrong palette. */
    (function(){try{var t=localStorage.getItem('fpvgate-theme');
    if(!t)t=window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
    document.documentElement.setAttribute('data-theme',t);}catch(e){
    document.documentElement.setAttribute('data-theme','dark');}
    document.documentElement.classList.add('js');})();
    </script>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Checkout uses the shared tokens from styles.css. */
        body { min-height: 100vh; }

        .checkout-header { background: var(--surface); border-bottom: 1px solid var(--rule); padding: 0; }
        .checkout-header .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; height: 64px; display: flex; align-items: center; justify-content: space-between; }
        .checkout-header h1 { font-size: 1.0625rem; font-weight: 600; color: var(--ink); }
        .checkout-header h1 span { color: var(--accent); }
        .checkout-header a { color: var(--ink-2); text-decoration: none; font-size: 0.875rem; }
        .checkout-header a:hover { color: var(--ink); }

        .checkout-body { max-width: 1100px; margin: 0 auto; padding: clamp(1.75rem, 4vw, 2.75rem) 20px; display: grid; grid-template-columns: 1fr 380px; gap: 32px; align-items: start; }

        .checkout-section { background: var(--surface-1); border-radius: var(--r-lg); border: 1px solid var(--rule); padding: 26px; margin-bottom: 20px; }
        .checkout-section h2 { font-size: 1rem; color: var(--ink); margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--rule); }

        label { display: block; font-size: 0.75rem; font-weight: 500; letter-spacing: 0.02em; color: var(--ink-2); margin-bottom: 5px; margin-top: 14px; }
        label:first-of-type { margin-top: 0; }
        input, select { width: 100%; padding: 10px 12px; border: 1px solid var(--rule); border-radius: var(--r); font-size: 0.9375rem; font-family: var(--font-body); background: var(--surface-2); color: var(--ink); transition: border-color 0.15s ease, box-shadow 0.15s ease; }
        input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgb(var(--accent-rgb) / 0.18); }
        .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .btn-rates { width: 100%; padding: 11px; background: transparent; color: var(--ink); border: 1px solid var(--rule-strong); border-radius: var(--r); font-family: var(--font-body); font-size: 0.875rem; font-weight: 500; cursor: pointer; margin-top: 18px; transition: background 0.15s ease, border-color 0.15s ease; }
        .btn-rates:hover { background: var(--surface-2); }
        .btn-rates:disabled { color: var(--ink-3); border-color: var(--rule); cursor: not-allowed; }

        /* Shipping rates */
        .rates-list { margin-top: 16px; }
        .rate-card { display: flex; align-items: center; justify-content: space-between; padding: 13px 15px; border: 1px solid var(--rule); border-radius: var(--r); margin-bottom: 8px; cursor: pointer; transition: border-color 0.15s ease, background 0.15s ease; }
        .rate-card:hover { border-color: var(--rule-strong); }
        .rate-card.selected { border-color: var(--accent); background: var(--surface-2); }
        .rate-card .rate-info { flex: 1; }
        .rate-card .rate-name { font-weight: 500; font-size: 0.875rem; color: var(--ink); }
        .rate-card .rate-days { font-size: 0.75rem; color: var(--ink-3); margin-top: 2px; }
        .rate-card .rate-price { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 500; font-size: 0.9375rem; color: var(--ink); white-space: nowrap; margin-left: 16px; }
        .rate-card .rate-check { width: 16px; height: 16px; border: 1px solid var(--rule-strong); border-radius: 50%; margin-right: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .rate-card.selected .rate-check { border-color: var(--accent-fill); background: var(--accent-fill); }
        .rate-card.selected .rate-check::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent-ink); }

        /* Order summary */
        .summary-card { background: var(--surface-1); border-radius: var(--r-lg); border: 1px solid var(--rule); padding: 26px; position: sticky; top: 24px; }
        .summary-card h2 { font-size: 1rem; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--rule); }
        .summary-item { display: flex; flex-direction: row; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--rule); align-items: center; }
        .summary-item-info { display: flex; gap: 12px; align-items: center; flex: 1; min-width: 0; }
        .summary-item-img { width: 44px; height: 44px; border-radius: var(--r); background: var(--surface-2); border: 1px solid var(--rule); overflow: hidden; flex-shrink: 0; }
        .summary-item-img img { width: 100%; height: 100%; object-fit: cover; }
        .summary-item-name { font-size: 0.875rem; font-weight: 450; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .summary-item-qty { font-family: var(--font-mono); font-size: 0.6875rem; color: var(--ink-3); }
        .summary-item-price { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 500; font-size: 0.875rem; white-space: nowrap; margin-left: 12px; }
        .summary-line { display: flex; justify-content: space-between; padding: 8px 0; font-size: 0.875rem; color: var(--ink-2); }
        .summary-line span:last-child { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--ink); }
        .summary-total { display: flex; justify-content: space-between; padding: 14px 0 0; margin-top: 8px; border-top: 1px solid var(--rule-strong); font-size: 1.0625rem; font-weight: 600; color: var(--ink); }
        .summary-total span:last-child { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

        .btn-pay { width: 100%; padding: 13px; background: var(--accent-fill); color: var(--accent-ink); border: 1px solid var(--accent-fill); border-radius: var(--r); font-family: var(--font-body); font-size: 0.9375rem; font-weight: 500; cursor: pointer; margin-top: 20px; transition: background 0.15s ease; }
        .btn-pay:hover { background: var(--accent-fill-hover); border-color: var(--accent-fill-hover); }
        .btn-pay:disabled { opacity: 0.45; cursor: not-allowed; }

        /* Pre-order acknowledgement. .preorder-notice itself lives in styles.css. */
        .checkout-preorder { margin-bottom: 20px; padding: 18px 20px; }
        .checkout-preorder p { font-size: 0.9375rem; }
        .checkout-preorder .preorder-ack { display: flex; gap: 10px; align-items: flex-start; margin: 14px 0 0; font-size: 0.875rem; font-weight: 600; letter-spacing: 0; color: var(--ink); cursor: pointer; }
        .checkout-preorder .preorder-ack input { width: 18px; height: 18px; flex-shrink: 0; margin: 1px 0 0; padding: 0; accent-color: var(--accent-fill); cursor: pointer; }
        .summary-item-preorder { font-size: 0.6875rem; font-weight: 600; color: var(--warn); }

        .checkout-error { color: var(--err); font-size: 0.8125rem; margin-top: 8px; }
        .checkout-empty { text-align: center; padding: 60px 20px; color: var(--ink-2); }
        .checkout-empty a { color: var(--accent); }

        .loading-spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--accent-ink); border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .checkout-body { grid-template-columns: 1fr; padding-bottom: 140px; }
            .summary-card { position: static; }
            .row-2 { grid-template-columns: 1fr; }
            .btn-pay { position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; border-radius: 0; margin: 0; padding: 16px 20px; font-size: 1rem; }
            .checkout-error { position: fixed; bottom: 54px; left: 0; right: 0; z-index: 100; background: var(--surface); text-align: center; padding: 0 20px; }
        }
    </style>
</head>
<body>
    <div class="checkout-header">
        <div class="container">
            <h1><span>FPVGate</span> Checkout</h1>
            <a href="shop.html">Back to Shop</a>
        </div>
    </div>

    <div class="checkout-body" id="checkout-body">
        <div class="checkout-left">
            <div class="preorder-notice checkout-preorder" id="preorder-notice" style="display:none">
                <strong>This order contains a pre-order</strong>
                <p><span id="preorder-items"></span> not in stock yet. Your order will not be shipped until <strong class="preorder-date"></strong>. Everything in the order ships together once the stock arrives.</p>
                <label class="preorder-ack"><input type="checkbox" id="preorder-ack" onchange="updatePayButton()"><span>I understand this is a pre-order and will not be shipped until <span class="preorder-date"></span>.</span></label>
            </div>

            <div class="checkout-section">
                <h2>Shipping Address</h2>
                <label>Full Name *</label>
                <input type="text" id="ship-name" autocomplete="name">
                <label>Email *</label>
                <input type="email" id="ship-email" autocomplete="email" required>
                <label>Address Line 1 *</label>
                <input type="text" id="ship-address1" autocomplete="address-line1">
                <label>Address Line 2</label>
                <input type="text" id="ship-address2" autocomplete="address-line2">
                <div class="row-2">
                    <div><label>City *</label><input type="text" id="ship-city" autocomplete="address-level2"></div>
                    <div><label>County / State</label><input type="text" id="ship-province" autocomplete="address-level1"></div>
                </div>
                <div class="row-2">
                    <div><label>Postcode *</label><input type="text" id="ship-postcode" autocomplete="postal-code"></div>
                    <div><label>Country *</label>
                        <select id="ship-country" autocomplete="country">
                            <option value="">Select country</option>
                            <option value="GB" selected>United Kingdom</option>
                            <option value="IE">Ireland</option>
                            <option value="FR">France</option>
                            <option value="DE">Germany</option>
                            <option value="NL">Netherlands</option>
                            <option value="BE">Belgium</option>
                            <option value="ES">Spain</option>
                            <option value="IT">Italy</option>
                            <option value="PT">Portugal</option>
                            <option value="AT">Austria</option>
                            <option value="CH">Switzerland</option>
                            <option value="SE">Sweden</option>
                            <option value="NO">Norway</option>
                            <option value="DK">Denmark</option>
                            <option value="FI">Finland</option>
                            <option value="PL">Poland</option>
                            <option value="CZ">Czech Republic</option>
                            <option value="LT">Lithuania</option>
                            <option value="US">United States</option>
                            <option value="CA">Canada</option>
                            <option value="AU">Australia</option>
                            <option value="NZ">New Zealand</option>
                        </select>
                    </div>
                </div>
                <label>Phone *</label>
                <input type="tel" id="ship-phone" autocomplete="tel" required>

                <button class="btn-rates" id="btn-rates" onclick="fetchRates()">Calculate Shipping</button>
            </div>

            <div class="checkout-section" id="shipping-section" style="display:none">
                <h2>Shipping Method</h2>
                <div class="rates-list" id="rates-list"></div>
            </div>
        </div>

        <div class="checkout-right">
            <div class="summary-card">
                <h2>Order Summary</h2>
                <div id="summary-items"></div>
                <div class="summary-line"><span>Subtotal</span><span id="summary-subtotal">-</span></div>
                <div class="summary-line"><span>Shipping</span><span id="summary-shipping">-</span></div>
                <div class="summary-total"><span>Total</span><span id="summary-total">-</span></div>
                <button class="btn-pay" id="btn-pay" disabled onclick="startCheckout()">Select shipping to continue</button>
                <div class="checkout-error" id="checkout-error"></div>
            </div>
        </div>
    </div>

    <script>
    const STORE_API = 'https://fpvgate-store.fpvgate-analytics.workers.dev';
    let selectedRate = null;
    let cartItems = [];
    let preorderShipDate = null;

    function getCart() { return JSON.parse(localStorage.getItem('fpvgate_cart') || '[]'); }

    function formatShipDate(isoDate) {
        const d = new Date(isoDate + 'T00:00:00Z');
        if (isNaN(d)) return isoDate;
        return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
    }

    // Work out which cart lines go past the stock on hand into pre-order.
    // Start from what the cart remembered, then replace it with live stock so a
    // cart built before the item sold out is still flagged.
    function applyPreorderInfo(liveProducts) {
        const byId = {};
        (liveProducts || []).forEach(p => { byId[p.id] = p; });
        cartItems.forEach(item => {
            const live = byId[item.id];
            const inStock = live ? live.stock : (item.inStock || 0);
            const shipDate = live ? live.preorderShipDate : item.preorderShipDate;
            item.preorderQty = shipDate ? Math.max(0, item.quantity - inStock) : 0;
            item.preorderShipDate = item.preorderQty > 0 ? shipDate : null;
        });
        preorderShipDate = cartItems.map(i => i.preorderShipDate).filter(Boolean).sort().pop() || null;

        const notice = document.getElementById('preorder-notice');
        if (preorderShipDate) {
            const names = cartItems.filter(i => i.preorderQty > 0).map(i => i.name);
            document.getElementById('preorder-items').textContent = names.join(', ') + (names.length === 1 ? ' is' : ' are');
            document.querySelectorAll('.preorder-date').forEach(el => { el.textContent = formatShipDate(preorderShipDate); });
            notice.style.display = 'block';
        } else {
            notice.style.display = 'none';
            document.getElementById('preorder-ack').checked = false;
        }
        renderSummary();
        updatePayButton();
    }

    async function loadPreorderInfo() {
        applyPreorderInfo(null);
        try {
            const resp = await fetch(STORE_API + '/products');
            if (resp.ok) applyPreorderInfo(await resp.json());
        } catch (e) {}
    }

    function init() {
        cartItems = getCart();
        if (cartItems.length === 0) {
            document.getElementById('checkout-body').innerHTML = '<div class="checkout-empty"><h2>Your cart is empty</h2><p style="margin-top:12px"><a href="shop.html">Continue shopping</a></p></div>';
            return;
        }
        renderSummary();
        loadPreorderInfo();
    }

    function renderSummary() {
        let subtotal = 0;
        document.getElementById('summary-items').innerHTML = cartItems.map(item => {
            subtotal += item.price * item.quantity;
            return `<div class="summary-item">
                <div class="summary-item-info">
                    <div class="summary-item-img">${item.image ? `<img src="${item.image}">` : ''}</div>
                    <div><div class="summary-item-name">${item.name}</div><div class="summary-item-qty">Qty: ${item.quantity}</div>${item.preorderQty > 0 ? `<div class="summary-item-preorder">Pre-order: ships ${formatShipDate(item.preorderShipDate)}</div>` : ''}</div>
                </div>
                <div class="summary-item-price">&pound;${(item.price * item.quantity).toFixed(2)}</div>
            </div>`;
        }).join('');
        document.getElementById('summary-subtotal').innerHTML = '&pound;' + subtotal.toFixed(2);
        updateTotal();
    }

    function updateTotal() {
        const cart = getCart();
        const subtotal = cart.reduce((s, i) => s + i.price * i.quantity, 0);
        const shipping = selectedRate ? selectedRate.amount : 0;
        document.getElementById('summary-shipping').innerHTML = selectedRate ? '&pound;' + shipping.toFixed(2) : '-';
        document.getElementById('summary-total').innerHTML = '&pound;' + (subtotal + shipping).toFixed(2);
    }

    async function fetchRates() {
        const name = document.getElementById('ship-name').value.trim();
        const addr1 = document.getElementById('ship-address1').value.trim();
        const city = document.getElementById('ship-city').value.trim();
        const postcode = document.getElementById('ship-postcode').value.trim();
        const country = document.getElementById('ship-country').value;
        const email = document.getElementById('ship-email').value.trim();
        const phone = document.getElementById('ship-phone').value.trim();

        if (!name || !addr1 || !city || !postcode || !country || !email || !phone) {
            document.getElementById('checkout-error').textContent = 'Please fill in all required fields.';
            return;
        }
        document.getElementById('checkout-error').textContent = '';

        const btn = document.getElementById('btn-rates');
        btn.disabled = true;
        btn.innerHTML = '<span class="loading-spinner"></span>Calculating...';

        try {
            const resp = await fetch(STORE_API + '/shipping-rates', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    shipping: {
                        name, address1: addr1,
                        address2: document.getElementById('ship-address2').value.trim(),
                        city, province: document.getElementById('ship-province').value.trim(),
                        postalCode: postcode, country,
                        phone,
                        email
                    }
                })
            });
            const data = await resp.json();
            if (data.error) {
                document.getElementById('checkout-error').textContent = data.error;
                btn.disabled = false; btn.textContent = 'Calculate Shipping';
                return;
            }

            const list = document.getElementById('rates-list');
            const rates = data.rates || [];
            if (rates.length === 0) {
                list.innerHTML = '<div style="color:#718096;text-align:center;padding:16px">No shipping options available for this address.</div>';
            } else {
                list.innerHTML = rates.map((r, i) => `
                    <div class="rate-card" id="rate-${i}" onclick="selectRate(${i})">
                        <div class="rate-check"></div>
                        <div class="rate-info">
                            <div class="rate-name">${r.provider} - ${r.service}</div>
                            <div class="rate-days">${r.estimatedDays ? r.estimatedDays + ' business day(s)' : ''} ${r.durationTerms || ''}</div>
                        </div>
                        <div class="rate-price">&pound;${r.amount.toFixed(2)}</div>
                    </div>
                `).join('');
                window._shippingRates = rates;

                // Auto-select Evri rate as default, fall back to first rate
                const evriIdx = rates.findIndex(r => r.provider && r.provider.toLowerCase().includes('evri'));
                selectRate(evriIdx >= 0 ? evriIdx : 0);
            }
            document.getElementById('shipping-section').style.display = 'block';
            btn.textContent = 'Recalculate Shipping';
            btn.disabled = false;
        } catch (e) {
            document.getElementById('checkout-error').textContent = 'Failed to get shipping rates. Please try again.';
            btn.disabled = false; btn.textContent = 'Calculate Shipping';
        }
    }

    function selectRate(idx) {
        document.querySelectorAll('.rate-card').forEach(c => c.classList.remove('selected'));
        document.getElementById('rate-' + idx).classList.add('selected');
        selectedRate = window._shippingRates[idx];
        updateTotal();
        updatePayButton();
    }

    function updatePayButton() {
        const btn = document.getElementById('btn-pay');
        if (!selectedRate) {
            btn.disabled = true;
            btn.textContent = 'Select shipping to continue';
        } else if (preorderShipDate && !document.getElementById('preorder-ack').checked) {
            btn.disabled = true;
            btn.textContent = 'Confirm the pre-order notice to continue';
        } else {
            btn.disabled = false;
            btn.textContent = 'Pay with Stripe';
        }
    }

    async function startCheckout() {
        const errEl = document.getElementById('checkout-error');
        errEl.textContent = '';

        if (!selectedRate) { errEl.textContent = 'Please select a shipping method.'; return; }
        const preorderAcknowledged = document.getElementById('preorder-ack').checked;
        if (preorderShipDate && !preorderAcknowledged) {
            errEl.textContent = 'Please confirm you understand this order is a pre-order.';
            document.getElementById('preorder-notice').scrollIntoView({ behavior: 'smooth', block: 'center' });
            return;
        }

        const cart = getCart();
        if (!cart.length) return;
        const shipping = {
            name: document.getElementById('ship-name').value.trim(),
            address1: document.getElementById('ship-address1').value.trim(),
            address2: document.getElementById('ship-address2').value.trim(),
            city: document.getElementById('ship-city').value.trim(),
            province: document.getElementById('ship-province').value.trim(),
            postalCode: document.getElementById('ship-postcode').value.trim(),
            country: document.getElementById('ship-country').value,
            phone: document.getElementById('ship-phone').value.trim(),
            email: document.getElementById('ship-email').value.trim()
        };

        if (!shipping.phone || !shipping.email) {
            errEl.textContent = 'Please enter both phone number and email.';
            return;
        }

        const btn = document.getElementById('btn-pay');
        btn.disabled = true;
        btn.innerHTML = '<span class="loading-spinner"></span>Redirecting to payment...';

        try {
            const resp = await fetch(STORE_API + '/checkout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    items: cart.map(i => ({ id: i.id, quantity: i.quantity })),
                    preorderAcknowledged,
                    shipping,
                    selectedShippingRate: {
                        amount: selectedRate.amount,
                        name: selectedRate.provider + ' - ' + selectedRate.service,
                        estimatedDays: selectedRate.estimatedDays
                    },
                    successUrl: window.location.origin + '/order-success.html?session_id={CHECKOUT_SESSION_ID}',
                    cancelUrl: window.location.origin + '/checkout.html'
                })
            });
            const data = await resp.json();
            if (data.error) {
                errEl.textContent = data.error;
                btn.disabled = false; btn.textContent = 'Pay with Stripe';
                // Stock changed since the page loaded: re-check so the notice shows
                if (data.preorderRequired) loadPreorderInfo();
                return;
            }
            if (data.url) window.location.href = data.url;
        } catch (e) {
            errEl.textContent = 'Checkout failed. Please try again.';
            btn.disabled = false; btn.textContent = 'Pay with Stripe';
        }
    }

    init();
    </script>
    <script src="theme.js"></script>
</body>
</html>
