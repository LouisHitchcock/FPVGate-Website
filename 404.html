<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting... | FPVGate</title>
<link rel="icon" type="image/png" href="/logo-black.png">
<script>
(function(){
    var slug = window.location.pathname.replace(/^\/+|\/+$/g, '');
    if (slug && /^[a-z0-9_-]+$/i.test(slug)) {
        var API = 'https://fpvgate-store.fpvgate-analytics.workers.dev';
        var x = new XMLHttpRequest();
        x.open('GET', API + '/s/' + encodeURIComponent(slug), true);
        x.timeout = 3000;
        x.onload = function() {
            if (x.status === 200) {
                try {
                    var d = JSON.parse(x.responseText);
                    if (d.url) { window.location.replace(d.url); return; }
                } catch(e) {}
            }
            show404();
        };
        x.onerror = x.ontimeout = function() { show404(); };
        x.send();
    } else {
        show404();
    }
    function show404() {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('notfound').style.display = 'flex';
    }
})();
</script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  color-scheme: dark;
  --surface: #14161A; --ink: #E9EAEC; --ink-2: #A0A4AB; --rule: #2B2F36;
  --accent: #6FB2F2; --accent-fill: #1F6FCC; --accent-fill-hover: #2A80E0; --accent-ink: #fff;
}
@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --surface: #F2F3F4; --ink: #16181C; --ink-2: #52565D; --rule: #DEE0E3;
    --accent: #0F55A8; --accent-fill: #12599F; --accent-fill-hover: #0E4880;
  }
}
body {
  font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  background: var(--surface); color: var(--ink); min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
#loader { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.spinner { width: 24px; height: 24px; border: 2px solid var(--rule); border-top-color: var(--accent); border-radius: 50%; animation: spin .6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#notfound { display: none; flex-direction: column; align-items: flex-start; justify-content: center; min-height: 100vh; text-align: left; padding: 40px clamp(20px, 8vw, 80px); max-width: 640px; }
#notfound .code { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); margin-bottom: 20px; }
#notfound h1 { font-size: clamp(2rem, 1.4rem + 2.4vw, 3rem); font-weight: 600; letter-spacing: -0.03em; line-height: 1.1; }
#notfound p { color: var(--ink-2); font-size: 15px; margin: 12px 0 32px; max-width: 46ch; line-height: 1.6; }
#notfound a { display: inline-block; padding: 10px 18px; background: var(--accent-fill); color: var(--accent-ink); text-decoration: none; border-radius: 5px; font-weight: 500; font-size: 14px; transition: background .15s ease; }
#notfound a:hover { background: var(--accent-fill-hover); }
</style>
</head>
<body>
<div id="loader"><div class="spinner"></div></div>
<div id="notfound">
<span class="code">Error 404</span>
<h1>That page doesn't exist.</h1>
<p>The link may be out of date, or the page has moved. Head back to the site and try again from there.</p>
<a href="/">Back to FPVGate</a>
</div>
</body>
</html>
